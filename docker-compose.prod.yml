version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: itsm-nere-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - itsm-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: itsm-nere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
    networks:
      - itsm-network
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: itsm-nere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nere_intranet_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - itsm-network

  redis:
    image: redis:alpine
    container_name: itsm-nere-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - itsm-network

networks:
  itsm-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local